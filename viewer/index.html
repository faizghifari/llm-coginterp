<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark Similarity viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
<header>
  <h1>Benchmark Similarity</h1>
  <div class="controls">
    <label>densifier
      <select id="dz"></select>
    </label>
    <label>nfactors
      <select id="tag"></select>
    </label>
    <label>cohort
      <select id="year"></select>
    </label>
    <label>cluster
      <select id="algo">
        <option value="hac">hierarchical</option>
        <option value="hdbscan">HDBSCAN</option>
      </select>
    </label>
    <label>k
      <select id="k"></select>
    </label>
    <label>factors
      <select id="variant">
        <option value="with_g">with g</option>
        <option value="without_g">without g</option>
      </select>
    </label>
    <label>color by
      <select id="colorby"></select>
    </label>
    <span id="meta"></span>
  </div>
</header>
<main>
  <canvas id="plot"></canvas>
  <aside>
    <div class="side-head" id="legend-head" title="Cluster mode: clusters by id and size only, no inferred name. Category mode: pick ONE category to highlight; its cohesion score (is this set tighter in the distance matrix than a coverage-matched random set?) is shown in the header. Ids are per-cell.">
      <span>Groups</span>
    </div>
    <div id="legend"></div>
    <div class="side-head">
      <span>Highlight</span>
      <button id="clear" type="button">Clear</button>
    </div>
    <input id="filter" type="search" placeholder="Filter…">
    <div id="list"></div>
  </aside>
</main>
</div>
<div id="tooltip" hidden></div>
<script src="positions.js"></script>
<script src="app.js"></script>
</body>
</html>
