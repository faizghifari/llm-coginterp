<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark Similarity viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
<header>
  <h1>Benchmark Similarity</h1>
  <div class="controls">
    <label>densifier
      <select id="dz"></select>
    </label>
    <label>tag
      <select id="tag"></select>
    </label>
    <span id="meta"></span>
  </div>
</header>
<main>
  <canvas id="plot"></canvas>
  <aside>
    <div class="side-head">
      <span>Highlight</span>
      <button id="clear" type="button">Clear</button>
    </div>
    <input id="filter" type="search" placeholder="Filter…">
    <div id="list"></div>
  </aside>
</main>
</div>
<div id="tooltip" hidden></div>
<script src="positions.js"></script>
<script src="app.js"></script>
</body>
</html>
