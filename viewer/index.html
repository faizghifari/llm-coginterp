<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>benchmark similarity viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
<header>
  <h1>benchmark similarity</h1>
  <div class="controls">
    <label>densifier
      <select id="dz"></select>
    </label>
    <label>tag
      <select id="tag"></select>
    </label>
    <label>focus
      <select id="focus"><option value="">—</option></select>
    </label>
  </div>
  <div id="meta"></div>
</header>
<main>
  <canvas id="plot"></canvas>
  <aside>
    <div class="side-head">
      <span>highlight</span>
      <button id="clear" type="button">clear</button>
    </div>
    <div id="list"></div>
  </aside>
</main>
</div>
<div id="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
